<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Películas • Pinheirinho Celulares</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>

<body data-theme="light">

<button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
  <i class="fas fa-sun"></i>
  <i class="fas fa-moon"></i>
</button>

<div class="tabs-container">
  <button class="tab-button active" onclick="switchTab('pesquisa', this)">
    <i class="fas fa-search"></i>
    Pesquisa Adaptações
  </button>
  <button class="tab-button" onclick="switchTab('placa', this)">
    <i class="fas fa-image"></i>
    Placa Película
  </button>
  <button class="tab-button" onclick="switchTab('placa-capa', this)">
    <i class="fas fa-layer-group"></i>
    Placa de Capa
  </button>
</div>

<div id="pesquisa" class="tab-content active">
  <div class="pesquisa-header">
    <div class="logo-container">
      <img src="amg/logo.png" alt="Pinheirinho Celulares" class="logo" 
           onerror="this.style.display='none'; this.parentElement.innerHTML='<h1 style=color:var(--azul)>Pinheirinho Celulares</h1>'">
    </div>
    
    <div class="search-container">
      <div class="search-wrapper">
        <input id="busca" type="text" placeholder="Digite o modelo ou marca do celular..." autocomplete="off">
        <i class="fas fa-search"></i>
      </div>
    </div>
  </div>

  <div class="container" id="resultado"></div>

  <div class="footer">
    <div class="footer-content">
      <span>Desenvolvido por <strong>Mattheus Avilar</strong></span>
      <span>•</span>
      <span style="background:linear-gradient(135deg,var(--azul),var(--laranja));-webkit-background-clip:text;-webkit-text-fill-color:transparent">Versão 5.0</span>
    </div>
  </div>
</div>

<div id="placa" class="tab-content">
  <div class="placa-container">
    <div class="topo-fixo">
      <h2>
        <i class="fas fa-palette"></i>
        Placa Película
      </h2>

      <div class="select-container">
        <select id="fabricante">
          <option value="">Fabricante</option>
        </select>

        <select id="modelo" disabled>
          <option value="">Modelo</option>
        </select>

        <button class="btn-gerar" onclick="gerarImagemPelicula()">
          <i class="fas fa-wand-magic-sparkles"></i>
          Gerar
        </button>

        <button class="btn-download" onclick="baixarImagemPelicula()">
          <i class="fas fa-download"></i>
          Baixar
        </button>
      </div>
    </div>

    <div class="area-canvas">
      <div class="canvas-wrapper">
        <canvas id="canvas" width="591" height="591"></canvas>
        <p style="margin-top: 15px; font-size: 13px; color: var(--text-muted); font-weight: 500;">
          <i class="fas fa-ruler-combined"></i> Tamanho de saída: 591x591px (5x5 cm a 300 DPI)
        </p>
      </div>
    </div>
  </div>
</div>

<div id="placa-capa" class="tab-content">
  <div class="placa-container">
    <div class="topo-fixo">
      <h2>
        <i class="fas fa-layer-group"></i>
        Placa de Capa
      </h2>

      <div class="select-container" style="flex-wrap: wrap; gap: 10px; justify-content: center;">
        <select id="fabricanteCapa" style="flex: 1; min-width: 150px; max-width: 200px;">
          <option value="">Fabricante</option>
        </select>

        <input type="text" id="linha1Capa" class="input-modelo" placeholder="Linha 1 do modelo" maxlength="30" style="flex: 1; min-width: 150px; max-width: 200px;">
        <input type="text" id="linha2Capa" class="input-modelo" placeholder="Linha 2 do modelo" maxlength="30" style="flex: 1; min-width: 150px; max-width: 200px;">
        <input type="text" id="linha3Capa" class="input-modelo" placeholder="Linha 3 do modelo" maxlength="30" style="flex: 1; min-width: 150px; max-width: 200px;">

        <button class="btn-gerar" onclick="gerarImagemCapa()" style="flex: 0 0 auto; min-width: 110px;">
          <i class="fas fa-wand-magic-sparkles"></i>
          Gerar
        </button>

        <button class="btn-download" onclick="baixarImagemCapa()" style="flex: 0 0 auto; min-width: 110px;">
          <i class="fas fa-download"></i>
          Baixar
        </button>
      </div>
    </div>

    <div class="area-canvas">
      <div class="canvas-wrapper">
        <canvas id="canvasCapa" width="591" height="591"></canvas>
        <p style="margin-top: 15px; font-size: 13px; color: var(--text-muted); font-weight: 500;">
          <i class="fas fa-ruler-combined"></i> Tamanho de saída: 591x591px (5x5 cm a 300 DPI)
        </p>
      </div>
    </div>
  </div>
</div>

<!-- Firebase (banco de dados dos likes/deslikes das adaptações) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script src="script.js"></script>

</body>
</html>
